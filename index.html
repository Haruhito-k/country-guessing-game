function nextQuestion() {

m.src = current.file; // 画像をセット
s = 0.8;
b.value = "";
tText.innerText = "ターゲットを破壊せよ！！";
update();
}

function update() {
if(!current) return;
m.style.transformOrigin = current.x + "% " + current.y + "%";
m.style.transform = "translate(-" + current.x + "%, -" + current.y + "%) scale(" + s + ")";
}

nextQuestion();

setInterval(function() {
s = s + 0.004;
update();
if (s > 7) {
alert("防衛失敗！正解は「" + current.name + "」");
nextQuestion();
}
}, 20);

b.onkeypress = function(e) {

} else {

}
